# OMG Coffee — Master Menu
# Single source of truth. All platform menus are generated from this file.
# Never edit individual platform menus directly.
#
# Fields:
#   id:              unique item identifier
#   name_zh:         Chinese display name
#   name_en:         English display name
#   category:        drink | food | merchandise | subscription
#   base_price:      price in TWD (NT$)
#   in_stock:        true/false — disables on all platforms when false
#   available_from:  (optional) YYYY-MM-DD seasonal start
#   available_until: (optional) YYYY-MM-DD seasonal end
#   platforms:       list of platforms to publish to
#   options:         size/add-on variants with price deltas
#   tags:            for filtering (signature, seasonal, new, popular)

categories:
  - id: drink
    name_zh: 飲品
    name_en: Drinks
  - id: food
    name_zh: 輕食
    name_en: Food
  - id: merchandise
    name_zh: 周邊商品
    name_en: Merchandise
  - id: subscription
    name_zh: 訂閱方案
    name_en: Subscriptions

items:
